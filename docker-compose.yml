services:
  db:
    image: postgis/postgis:16-3.4
    container_name: aed_postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aed_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-aed_registry}
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./backend/sql/postgis_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aed} -d ${POSTGRES_DB:-aed_registry}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aed_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aed}:${POSTGRES_PASSWORD:-aed_dev_password}@db:5432/${POSTGRES_DB:-aed_registry}
      DEDUP_RADIUS_M: ${DEDUP_RADIUS_M:-25}
      OVERPASS_URL: ${OVERPASS_URL:-https://overpass-api.de/api/interpreter}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DATA_DIR: /app/data
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgis_data:
